name: immich
services:
  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
      - ${THUMB_LOCATION}:/data/thumbs
      - ${ENCODED_VIDEO_LOCATION}:/data/encoded-video
      - ${EXTERNAL_LIB_LOCATION}/vieira/scanned:/usr/src/app/external/scans
      - ${EXTERNAL_LIB_LOCATION}/vieira/external_drive/ipad:/usr/src/app/external/external_drive/ipad
      - ${EXTERNAL_LIB_LOCATION}/vieira/external_drive/fotos2013:/usr/src/app/external/external_drive/fotos2013
      - ${EXTERNAL_LIB_LOCATION}/vieira/external_drive/cameras:/usr/src/app/external/external_drive/cameras
      - ${EXTERNAL_LIB_LOCATION}/gladden/usb:/usr/src/app/external/slides
      - ${EXTERNAL_LIB_LOCATION}/gladden/momdad/usb/Pictures:/usr/src/app/external/momdad
      - ${EXTERNAL_LIB_LOCATION}/vieira/drivy-wivy:/usr/src/app/external/drivy-wivy
      - ${EXTERNAL_LIB_LOCATION}/vieira/takeout:/usr/src/app/external/pat-takeout
    env_file:
      - .env
    ports:
      - 2283:2283
    expose:
      - 8081
      - 8082
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false
    labels:
      - traefik.enable=true
      - traefik.http.routers.immich.rule=Host(`${IMMICH_DOMAIN}`)
      - traefik.http.routers.immich.entrypoints=websecure
      - traefik.http.routers.immich.tls=true
      - traefik.http.routers.immich.tls.certresolver=le
    networks:
      - proxy
      - immich
      
  immich-machine-learning:
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-cuda
    extends:
      file: hwaccel.ml.yml
      service: cuda
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false
    networks:
      - immich
      
  redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always
    networks:
      - immich
      
  database:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    restart: always
    networks:
      - immich
      
volumes:
  model-cache: null
  
networks:
  immich:
    internal: true
  proxy:
    external: true
