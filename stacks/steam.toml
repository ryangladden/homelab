[[stack]]
name = "steam"

[stack.config]
server = "gertrude"
linked_repo = "homelab"
run_directory = "services/steam"

environment = """
#  ____            _                 
# / ___| _   _ ___| |_ ___ _ __ ___  
# \___ \| | | / __| __/ _ \ '_ ` _ \ 
#  ___) | |_| \__ \ ||  __/ | | | | |
# |____/ \__, |___/\__\___|_| |_| |_|
#        |___/                       

NAME=GertrudeGames
TZ=America/Denver
USER_LOCALES=en_US.UTF-8 UTF-8
DISPLAY=:55
SHM_SIZE=5G
HOME_DIR=/opt/state/steam/home
SHARED_SOCKETS_DIR=/opt/state/steam/sockets
GAMES_DIR=/opt/state/steam/games

#  ____        __             _ _     _   _               
# |  _ \  ___ / _| __ _ _   _| | |_  | | | |___  ___ _ __ 
# | | | |/ _ \ |_ / _` | | | | | __| | | | / __|/ _ \ '__|
# | |_| |  __/  _| (_| | |_| | | |_  | |_| \__ \  __/ |   
# |____/ \___|_|  \__,_|\__,_|_|\__|  \___/|___/\___|_|   
#                                                         

PUID=1000
PGID=1000
UMASK=000
USER_PASSWORD=[[STEAM_USER_PASS]]
MODE=primary

#  ____                  _               
# / ___|  ___ _ ____   _(_) ___ ___  ___ 
# \___ \ / _ \ '__\ \ / / |/ __/ _ \/ __|
#  ___) |  __/ |   \ V /| | (_|  __/\__ \
# |____/ \___|_|    \_/ |_|\___\___||___/
#                                        

# Web UI
WEB_UI_MODE=vnc            # Options: ['vnc', 'neko', 'none']
ENABLE_VNC_AUDIO=false
PORT_NOVNC_WEB=8083
NEKO_NAT1TO1=

# Steam
ENABLE_STEAM=true
STEAM_ARGS=-silent

# Sunshine
ENABLE_SUNSHINE=true
SUNSHINE_USER=admin
SUNSHINE_PASS=[[STEAM_SUNSHINE_PASS]]

# Xorg
ENABLE_EVDEV_INPUTS=true
FORCE_X11_DUMMY_CONFIG=true

# Nvidia specific config
NVIDIA_DRIVER_CAPABILITIES=all
NVIDIA_VISIBLE_DEVICES=all
"""
