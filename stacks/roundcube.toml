[[stack]]
name = "roundcube"
tags = ["service"]
[stack.config]
server = "gertrude"
linked_repo = "homelab"
run_directory = "services/roundcube"
environment = """
ROUNDCUBEMAIL_DB_TYPE=sqlite
ROUNDCUBEMAIL_SKIN=elastic
ROUNDCUBEMAIL_DEFAULT_HOST=tls://webmail.[[HOST_DOMAIN]]
ROUNDCUBEMAIL_SMTP_SERVER=tls://[[MAIL_HOST]]
"""
