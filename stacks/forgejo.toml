[[stack]]
name = "forgejo"
tags = ["service", "app"]
description = """
**Forgejo** — Git forge providing repository hosting, container registry, issue tracking, pull requests, and continuous integration workflows.

**Links:** [Documentation](https://forgejo.org/docs/latest/) · [Repository](https://codeberg.org/forgejo/forgejo) · [Website](https://forgejo.org/)
"""
[stack.config]
server = "gertrude"
linked_repo = "homelab"
run_directory = "services/forgejo"
environment = """
FORGEJO_HOST=git.[[HOST_DOMAIN]]
USER_UID=1000
USER_GID=1000
FORGEJO__server__ROOT_URL=https://git.[[HOST_DOMAIN]]/
"""
