[[stack]]
name = "couchdb"
tags = ["service"]
description = """
**Apache CouchDB** — Distributed NoSQL document database used for Obsidian Self-Hosted Live Sync

**Links:** [Documentation](https://docs.couchdb.org/) · [Repository](https://github.com/apache/couchdb) · [Website](https://couchdb.apache.org/)
"""
[stack.config]
server = "gertrude"
linked_repo = "homelab"
run_directory = "services/couchdb"
environment = """
COUCHDB_HOST=couch.[[HOST_DOMAIN]]
COUCHDB_USER=admin
COUCHDB_PASSWORD=[[COUCHDB_PASSWORD]]
"""
