[[stack]]
name = "ollama"
tags = ["service"]
description = """
**Ollama** — Local large language model runtime for running and serving AI models through a simple API.

**Links:** [Documentation](https://docs.ollama.com/) · [Repository](https://github.com/ollama/ollama) · [Website](https://ollama.com/)
"""
[stack.config]
server = "gertrude"
linked_repo = "homelab"
run_directory = "services/ollama"
environment = """
LLAMA_SWAP_API_KEY=[[LLAMA_SWAP_API_KEY]]
NVIDIA_VISIBLE_DEVICES=all
NVIDIA_DRIVER_CAPABILITIES: compute,utility
"""
