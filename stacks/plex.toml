[[stack]]
name = "plex"
tags = ["app"]
description = """
**Plex** — Media server for organizing, streaming, and managing personal libraries of movies, television shows, music, and other content.

**Links:** [Documentation](https://support.plex.tv/) · [Repository](https://github.com/plexinc) · [Website](https://www.plex.tv/)
"""
[stack.config]
server = "gertrude"
linked_repo = "homelab"
run_directory = "services/plex"
environment = """
PLEX_CLAIM=[[PLEX_CLAIM]]
ADVERTISE_IP=[[HOST_IP]]
TAUTULLI_HOST=plex.[[HOST_DOMAIN]]
TAUTULLI_USERNAME=[[TAUTULLI_USERNAME]]
TAUTULLI_PASSWORD=[[TAUTULLI_PASSWORD]]
TAUTULLI_APP_SECRET=[[TAUTULLI_APP_SECRET]]
"""
