[[stack]]
name = "traefik"
[stack.config]
server = "gertrude"
linked_repo = "homelab"
run_directory = "services/traefik"
environment = """
OC_MAPPER_USERNAME=[[OC_MAPPER_USERNAME]]
OC_MAPPER_APP_TOKEN=[[OC_MAPPER_APP_TOKEN]]
HOST_DOMAIN=[[HOST_DOMAIN]]
PRINTER_IP=[[PRINTER_IP]]
NAS_IP=[[NAS_IP]]
BACKUP_IP=[[BACKUP_IP]]
GERTRUDE_IP=[[GERTRUDE_IP]]
NAS_CREDENTIALS_BASE64=[[NAS_CREDENTIALS_BASE64]]
COLLECTIONS=crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
CUSTOM_HOSTNAME=crowdsec
BOUNCER_KEY_TRAEFIK=[[CROWDSEC_LAPI_KEY]]
ENROLL_KEY=[[CROWDSEC_ENROLL_KEY]]
ENROLL_INSTANCE_NAME=gertrude
ENROLL_TAGS=docker traefik
"""
