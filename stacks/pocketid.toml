[[stack]]
name = "pocketid"
tags = ["infra", "auth"]
description = """
**Pocket ID** — OpenID Connect identity provider offering passkey-based authentication and single sign-on.

**Links:** [Documentation](https://pocket-id.org/docs/) · [Repository](https://github.com/pocket-id/pocket-id) · [Website](https://pocket-id.org/)
"""
[stack.config]
server = "gertrude"
linked_repo = "homelab"
run_directory = "services/pocketid"
environment = """
ENCRYPTION_KEY=[[POCKETID_ENCRYPTION_KEY]]
APP_URL=https://[[POCKETID_HOST]]
POCKETID_HOST=[[POCKETID_HOST]]
TRUST_PROXY=true
MAXMIND_LICENSE_KEY=[[MAXMIND_API_KEY]]
PUID=1000
PGID=1000
"""
