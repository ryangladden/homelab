[[stack]]
name = "vaultwarden"
[stack.config]
server = "gertrude"
linked_repo = "homelab"
run_directory = "services/vaultwarden"
environment = """
DOMAIN=https://vault.[[HOST_DOMAIN]]
VAULTWARDEN_HOST=vault.[[HOST_DOMAIN]]
VAULTWARDEN_HOST_OLD=vault-old.[[HOST_DOMAIN]]
DISABLE_ADMIN_TOKEN=true # admin panel is behind tinyauth
#DATABASE_URL=postgresql://vaultwarden:[[VAULTWARDEN_POSTGRES_PASSWORD]]@postgres:5432/vaultwarden
SMTP_HOST=[[SMTP_HOST]]
SMTP_FROM=[[SMTP_FROM]]
SMTP_PORT=[[SMTP_PORT]]
SMTP_SECURITY=[[SMTP_TLS]]
SMTP_USERNAME=[[SMTP_USERNAME]]
SMTP_PASSWORD=[[SMTP_PASSWORD]]
SIGNUPS_ALLOWED=false
PUSH_ENABLED=true
PUSH_INSTALLATION_ID=[[VAULTWARDEN_INSTALLATION_ID]]
PUSH_INSTALLATION_KEY=[[VAULTWARDEN_INSTALLATION_KEY]]
POSTGRES_PASSWORD=[[VAULTWARDEN_POSTGRES_PASSWORD]]
"""