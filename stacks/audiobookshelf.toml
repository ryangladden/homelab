[[stack]]
name = "audiobooks"
tags = ["service"]
[stack.config]
server = "gertrude"
linked_repo = "homelab"
run_directory = "services/audiobooks"
environment = """
AUDIOBOOKSHELF_HOST=books.[[HOST_DOMAIN]]
SHELFMARK_HOST=library.[[HOST_DOMAIN]]

PROWLARR_ENABLED=true
PROWLARR_URL=http://prowlarr:9696
PROWLARR_API_KEY=[[PROWLARR_API_KEY]]
QBITTORRENT_URL=http://gluetun:8080
QBITTORRENT_USERNAME=[[ARR_USERNAME]]
QBITTORRENT_PASSWORD=[[ARR_PASSWORD]]
QBITTORRENT_CATEGORY=books
QBITTORRENT_CATEGORY_AUDIOBOOK=audiobooks
QBITTORRENT_DOWNLOAD_DIR=/data/torrents/audiobooks
OIDC_DISCOVERY_URL=[[POCKETID_DISCOVERY_URL]]
OIDC_CLIENT_ID=[[SHELFMARK_CLIENT_ID]]
OIDC_CLIENT_SECRET=[[SHELFMARK_CLIENT_SECRET]]
OIDC_ADMIN_GROUP=admin
OIDC_BUTTON_LABEL=ToucanID
AUTH_METHOD=oidc

LLM_PROVIDER=systemone-compatible
SYSTEMONE_API_KEY=
SYSTEMONE_BASE_URL=http://192.168.1.251:11434/v1/
WHISPER_BACKEND=openai-api
WHISPER_MODEL=large
WHISPER_DEVICE=cpu
WHISPER_COMPUTE_TYPE=auto
WHISPER_LANGUAGE=en
WHISPER_API_BASE_URL=http://whisper-server:8765/v1
WHISPER_API_KEY=
BASE_URL=https://localhost:8000
MINUSPOD_PORT=8000
LOG_FORMAT=text
LOG_LEVEL=INFO
MAX_AUDIO_DOWNLOAD_MB=500
MINUSPOD_MASTER_PASSPHRASE=[[MINUSPOD_MASTER_PASSPHRASE]]
MINUSPOD_REQUIRE_AUTH=true
MINUSPOD_SETUP_TOKEN=[[MINUSPOD_SETUP_TOKEN]]
RATE_LIMIT_STORAGE_URI=memory-threadsafe://
MINUSPOD_TRUSTED_PROXY_COUNT=0
"""
