[[stack]]
name = "audiobooks"
tags = ["service"]
[stack.config]
server = "gertrude"
linked_repo = "homelab"
run_directory = "services/audiobooks"
environment = """
AUDIOBOOKSHELF_HOST=books.[[HOST_DOMAIN]]
SHELFMARK_HOST=library.[[HOST_DOMAIN]]

PROWLARR_ENABLED=true
PROWLARR_URL=http://prowlarr:9696
PROWLARR_API_KEY=[[PROWLARR_API_KEY]]
QBITTORRENT_URL=http://gluetun:8080
QBITTORRENT_USERNAME=[[ARR_USERNAME]]
QBITTORRENT_PASSWORD=[[ARR_PASSWORD]]
QBITTORRENT_CATEGORY=books
QBITTORRENT_CATEGORY_AUDIOBOOK=audiobooks
QBITTORRENT_DOWNLOAD_DIR=/data/torrents/audiobooks
OIDC_DISCOVERY_URL=[[POCKETID_DISCOVERY_URL]]
OIDC_CLIENT_ID=[[SHELFMARK_CLIENT_ID]]
OIDC_CLIENT_SECRET=[[SHELFMARK_CLIENT_SECRET]]
OIDC_ADMIN_GROUP=admin
OIDC_BUTTON_LABEL=ToucanID
"""