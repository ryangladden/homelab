[[stack]]
name = "docker-socket-proxy"
tags = ["infra"]
description = """
Restricts Docker API access for services such as Traefik and TinyAuth.

**Links:** [Documentation](https://docs.linuxserver.io/images/docker-socket-proxy/) · [Repository](https://github.com/linuxserver/docker-socket-proxy)
"""
[stack.config]
server = "gertrude"
linked_repo = "homelab"
run_directory = "services/docker-socket-proxy"
environment = """
CONTAINERS=1
EVENTS=1
NETWORKS=1
PING=1
VERSION=1
POST=0
TZ=[[TZ]]
"""
