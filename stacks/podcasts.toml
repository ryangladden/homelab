[[stack]]
name = "podcasts"
tags = ["service"]
[stack.config]
server = "gertrude"
linked_repo = "homelab"
run_directory = "services/podcasts"
environment = """
PODCAST_HOST=podcasts.[[HOST_DOMAIN]]
SESSION_COOKIE_SECURE=true
GUNICORN_WORKERS=1
GUNICORN_THREADS=8
GPU_TRANSCRIBE_MAX_CONCURRENT=1
LLM_PROVIDER=ollama
WHISPER_BACKEND=parakeet
WHISPER_DEVICE=cuda
WHISPER_COMPUTE_TYPE=auto
WHISPER_LANGUAGE=en
BASE_URL=https://podcasts.[[HOST_DOMAIN]]
MINUSPOD_PORT=8000
LOG_FORMAT=text
LOG_LEVEL=INFO
MAX_AUDIO_DOWNLOAD_MB=500
MINUSPOD_MASTER_PASSPHRASE=[[MINUSPOD_MASTER_PASSPHRASE]]
MINUSPOD_REQUIRE_AUTH=true
MINUSPOD_SETUP_TOKEN=[[MINUSPOD_SETUP_TOKEN]]
RATE_LIMIT_STORAGE_URI=memory-threadsafe://
MINUSPOD_TRUSTED_PROXY_COUNT=1
"""
