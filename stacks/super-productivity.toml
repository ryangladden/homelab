[[stack]]
name = "super-productivity"
tags = ["service"]
[stack.config]
server = "gertrude"
linked_repo = "homelab"
run_directory = "services/super-productivity"
environment = """
SUPERPRODUCTIVITY_HOST=tasks.[[HOST_DOMAIN]]

POSTGRES_USER=supersync
POSTGRES_PASSWORD=[[SUPERSYNC_POSTGRES_PASSWORD]]
POSTGRES_DB=supersync

SUPERSYNC_HOST=task-sync.[[HOST_DOMAIN]]
NODE_ENV=production
PORT=1900
HOST=0.0.0.0
DATABASE_URL=postgresql://supersync:[[SUPERSYNC_POSTGRES_PASSWORD]]@postgres:5432/supersync?connection_limit=60&pool_timeout=10
RUN_MIGRATIONS_ON_STARTUP=true
REQUIRE_DATABASE_POOL_LIMITS=true
MIGRATE_RECOVERY_RUNTIME=compose
JWT_SECRET=[[SUPERSYNC_JWT_SECRET]]
PUBLIC_URL=https://task-sync.[[HOST_DOMAIN]]
CORS_ORIGINS=https://tasks.[[HOST_DOMAIN]]
SMTP_HOST=[[MAIL_HOST]]
SMTP_PORT=587
SMTP_SECURE=true
SMTP_USER=no-reply@[[MAIL_DOMAIN]]
SMTP_PASS=[[NO_REPLY_PASSWORD]]
SMTP_FROM=no-reply@[[MAIL_DOMAIN]]
WEBAUTHN_RP_ID=task-sync.[[HOST_DOMAIN]]
WEBAUTHN_RP_NAME=task-sync.[[HOST_DOMAIN]]
WEBAUTHN_ORIGIN=task-sync.[[HOST_DOMAIN]]
ALLOWED_EMAILS=[[SUPERSYNC_ALLOWED_EMAILS]]
SUPERSYNC_DEFAULT_STORAGE_QUOTA_BYTES=
OLD_OPS_CLEANUP_DELETE_BATCH_SIZE=5000
OLD_OPS_CLEANUP_MAX_DELETED_PER_RUN=25000
"""
