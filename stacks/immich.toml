[[stack]]
name = "immich"
tags = "[app]"
description = """
**Immich** — Self-hosted photo and video management platform with automatic mobile backups, facial recognition, and intelligent search.

**Links:** [Documentation](https://docs.immich.app/) · [Repository](https://github.com/immich-app/immich) · [Website](https://immich.app/)
"""
[stack.config]
server = "gertrude"
linked_repo = "homelab"
run_directory = "services/immich"
environment = """
UPLOAD_LOCATION=/mnt/immich/library
DB_DATA_LOCATION=/opt/data/immich/postgres
THUMB_LOCATION=/opt/data/immich/thumbs
ENCODED_VIDEO_LOCATION=/opt/state/immich/encoded-videos
EXTERNAL_LIB_LOCATION=/mnt/immich
TZ=America/Denver
IMMICH_VERSION="release"
IMMICH_TELEMETRY_INCLUDE=all
DB_PASSWORD=[[IMMICH_DB_PASSWORD]]
DB_USERNAME=postgres
DB_DATABASE_NAME=immich
IMMICH_API_KEY=[[IMMICH_API_KEY]]
IMMICH_URL=http://immich-server:2283
EXTERNAL_IMMICH_URL=https://fotos.[[HOST_DOMAIN]]
EXTERNAL_IMMICH_HOST=fotos.[[HOST_DOMAIN]]
IMMICH_HOST=0.0.0.0
DB_HOST=database
DB_PORT=5432
"""
