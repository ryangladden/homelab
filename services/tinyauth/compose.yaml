services:

  tinyauth:
    image: ghcr.io/tinyauthapp/tinyauth:v5
    container_name: tinyauth
    restart: unless-stopped
    env_file:
      - .env
    labels:
      traefik.enable: true
      traefik.http.routers.tinyauth.rule: Host(`${TINYAUTH_HOST}`)
      traefik.http.routers.tinyauth.entrypoints: websecure
      traefik.http.routers.tinyauth.tls: true
    networks:
      - proxy
      - radicale-internal
      - docker-socket-proxy
      
networks:
  proxy:
    external: true
  radicale-internal:
    external: true
  docker-socket-proxy:
    external: true
