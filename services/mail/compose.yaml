services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    # Provide the FQDN of your mail server here (Your DNS MX record should point to this value)
    hostname: ${MAIL_HOST}
    env_file: .env
    ports:
      - 25:25 # SMTP  (explicit TLS => STARTTLS, Authentication is DISABLED => use port 465/587 instead)
      - 143:143 # IMAP4 (explicit TLS => STARTTLS)
      - 465:465 # ESMTP (implicit TLS)
      - 587:587 # ESMTP (explicit TLS => STARTTLS)
      - 993:993 # IMAP4 (implicit TLS)
    volumes:
      - /opt/data/mail/data/:/var/mail/
      - /opt/data/mail/state/:/var/mail-state/
      - /opt/state/mail/logs/:/var/log/mail/
      - /opt/data/mail/config/:/tmp/docker-mailserver/
      - /etc/localtime:/etc/localtime:ro
      - /opt/state/traefik/letsencrypt/acme.json:/etc/letsencrypt/acme.json:ro
    restart: always
    stop_grace_period: 1m
    
  docker-mailserver-gui:
    container_name: mailserver-gui
    networks:
      - proxy
    environment:
      - DOCKER_CONTAINER=mailserver
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    image: dunajdev/docker-mailserver-gui:latest
    labels:
      - traefik.enable=true
  
      - traefik.http.routers.mail-admin.rule=Host(`${MAIL_HOST}`)
      - traefik.http.routers.mail-admin.entrypoints=websecure
      - traefik.http.routers.mail-admin.tls=true
      - traefik.http.routers.mail-admin.tls.certresolver=le
      - traefik.http.routers.mail-admin.middlewares=tinyauth@file
      
  autodiscover:
    image: monogramm/autodiscover-email-settings:latest
    container_name: autodiscover
    environment:
      - COMPANY_NAME=Homelab
      - SUPPORT_URL=https://${AUTODISCOVER_HOST}
      - DOMAIN=${MAIL_HOST}
      - IMAP_HOST=${MAIL_HOST}
      - IMAP_PORT=993
      - IMAP_SOCKET=SSL
      - SMTP_HOST=${MAIL_HOST}
      - SMTP_PORT=465
      - SMTP_SOCKET=SSL  
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.autoconfig.rule=Host(`${AUTODISCOVER_HOST}`) ||
        Host(`${AUTOCONFIG_HOST}`)
      - traefik.http.routers.autoconfig.entrypoints=websecure
      - traefik.http.routers.autoconfig.tls=true
      - traefik.http.routers.autoconfig.tls.certresolver=le
      - traefik.http.services.autoconfig.loadbalancer.server.port=8000

  roundcubemail:
    image: roundcube/roundcubemail:latest
    container_name: roundcube
    restart: unless-stopped
    volumes:
     - ./config/roundcube/:/var/roundcube/config
     - /opt/state/roundcube/plugins:/var/www/html/plugins
     - ./config/autologin.php:/var/www/html/public_html/autologin.php
    env_file: .env
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.roundcube.rule=Host(`${ROUNDCUBE_HOST}`)
      - traefik.http.routers.roundcube.entrypoints=websecure
      - traefik.http.routers.roundcube.tls=true
      - traefik.http.routers.roundcube.tls.certresolver=le
      - traefik.http.routers.roundcube.middlewares=tinyauth@file
      - traefik.http.services.roundcube.loadbalancer.server.port=80
      
networks:
  proxy:
    external: true
