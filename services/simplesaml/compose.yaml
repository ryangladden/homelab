services:
  simplesamlphp:
    image: cirrusid/simplesamlphp:latest
    container_name: simplesamlphp
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.simplesamlphp.rule=Host(`${SIMPLESAML_HOST}`)
      - traefik.http.routers.simplesamlphp.entrypoints=websecure
      - traefik.http.routers.simplesamlphp.tls=true
      - traefik.http.routers.simplesamlphp.tls.certresolver=le
      - traefik.http.services.simplesamlphp.loadbalancer.server.port=80
      # - traefik.http.services.simplesamlphp.loadbalancer.server.scheme=https
    volumes:
      - /opt/state/simplesaml/config:/var/simplesamlphp/config
      - /opt/state/simplesaml/metadata:/var/simplesamlphp/metadata
      - /opt/state/simplesaml/cert:/var/simplesamlphp/cert
      - /opt/state/simplesaml/log:/var/simplesamlphp/log
    environment:
      VIRTUAL_PROTO: https
      VIRTUAL_PORT: 443
    #   SSP_APACHE_ALIAS: /

networks:
  proxy:
    external: true
