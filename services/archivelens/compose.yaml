
name: archivelens

services:
  postgres:
    image: tensorchord/vchord-suite:pg17-20260501
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-archivelens}
      POSTGRES_USER: ${POSTGRES_USER:-archivelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1.2-alpine
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  adminer:
    image: adminer:6.1.1-standalone
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-archivelens-api:latest}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      python-worker:
        condition: service_healthy
    environment:
      ARCHIVELENS_ADDRESS: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-archivelens}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-archivelens}
      VALKEY_ADDRESS: valkey:6379

      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-archivelens}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_USE_PATH_STYLE: "true"

      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      WORKER_URL: http://python-worker:8000
      WORKER_SERVICE_TOKEN: ${WORKER_SERVICE_TOKEN:?WORKER_SERVICE_TOKEN is required}
      MAXIMUM_UPLOAD_BYTES: ${DOCUMENT_MAXIMUM_UPLOAD_BYTES:-262144000}
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  python-worker:
    image: ${WORKER_IMAGE:-archivelens-python-worker:latest}
    pids_limit: 1024
    depends_on:
      tika:
        condition: service_started
    volumes:
      - paddle-model-cache:/var/lib/archivelens/paddle-cache
    environment:
      BACKEND_URL: http://api:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      WORKER_SERVICE_TOKEN: ${WORKER_SERVICE_TOKEN}
      WORKER_ID: artifact-worker-1
      MAXIMUM_SOURCE_BYTES: ${DOCUMENT_MAXIMUM_UPLOAD_BYTES:-262144000}

      OCR_LANGUAGE: en
      OCR_DEVICE: cpu
      SPELLCHECK_TRANSCRIPTION_SUGGESTIONS: ${SPELLCHECK_TRANSCRIPTION_SUGGESTIONS:-true}
      LLM_TRANSCRIPTION_SUGGESTIONS: ${LLM_TRANSCRIPTION_SUGGESTIONS:-true}

      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_NORMALIZATION_MODEL: ${OLLAMA_NORMALIZATION_MODEL:-qwen3:4b}
      OLLAMA_CLASSIFICATION_MODEL: ${OLLAMA_CLASSIFICATION_MODEL:-nimble}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ENDPOINT: ${OPENAI_ENDPOINT:-https://api.openai.com/v1}
      OPENAI_NORMALIZATION_MODEL: ${OPENAI_NORMALIZATION_MODEL:-gpt-6-luna}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}

      DEFAULT_NORMALIZATION_PROVIDER: ${DEFAULT_NORMALIZATION_PROVIDER:-ollama}
      DEFAULT_CLASSIFICATION_PROVIDER: ${DEFAULT_CLASSIFICATION_PROVIDER:-ollama}
      DEFAULT_EMBEDDING_PROVIDER: ${DEFAULT_EMBEDDING_PROVIDER:-ollama}

      TIKA_ENDPOINT: http://tika:9998/tika/text
      TIKA_TIMEOUT_SECONDS: ${TIKA_TIMEOUT_SECONDS:-180}

      JEV_ENDPOINT: ${JEV_ENDPOINT:-https://api.typesafe.ai/v1/systemone}
      JEV_CLASSIFICATION_MODEL: ${JEV_CLASSIFICATION_MODEL:-jev-latest}
      JEV_CLASSIFICATION_YES_THRESHOLD: ${JEV_CLASSIFICATION_YES_THRESHOLD:-0.5}

      TEXT_SEGMENTATION_TARGET_TOKENS: ${TEXT_SEGMENTATION_TARGET_TOKENS:-375}
      TEXT_SEGMENTATION_OVERLAP: ${TEXT_SEGMENTATION_OVERLAP:-100}
      OLLAMA_CLASSIFICATION_YES_THRESHOLD: ${OLLAMA_CLASSIFICATION_YES_THRESHOLD:-0.6}
      OLLAMA_CLASSIFICATION_NUM_CTX: ${OLLAMA_CLASSIFICATION_NUM_CTX:-32768}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}

      PADDLEX_HOME: /var/lib/archivelens/paddle-cache
      PADDLEX_CACHE_DIR: /tmp/paddlex/temp
      PADDLE_PDX_CACHE_HOME: /var/lib/archivelens/paddle-cache
      PADDLE_HUB_HOME: /var/lib/archivelens/paddle-cache/official_models
      HUB_HOME: /var/lib/archivelens/paddle-cache/official_models
      TMPDIR: /tmp
      XDG_CACHE_HOME: /tmp/cache
      FLAGS_use_mkldnn: "0"

    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - tika-private
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  tika:
    image: apache/tika:4.1.0-1
    networks:
      - tika-private
    expose:
      - "9998"
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-archivelens-web:latest}
    depends_on:
      - api
    environment:
      API_PROXY_TARGET: http://api:8080
    ports:
      - "${WEB_PORT:-5173}:5173"
    restart: unless-stopped

volumes:
  postgres-data:
  valkey-data:
  paddle-model-cache:

networks:
  tika-private:
    internal: true
