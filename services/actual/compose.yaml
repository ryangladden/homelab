services:
  actual:
    image: docker.io/actualbudget/actual-server:latest
    container_name: actual
    env_file:
      - .env
    volumes:
      - /opt/data/actual:/data
    healthcheck:
      test:
        - CMD-SHELL
        - node src/scripts/health-check.js
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.actual.rule: Host(`${ACTUAL_HOST}`)
networks:
  proxy:
    external: true
