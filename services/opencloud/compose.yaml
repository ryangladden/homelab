services:
  opencloud:
    container_name: opencloud
    # renovate: depName=opencloudeu/opencloud-rolling
    image: opencloudeu/opencloud-rolling:${OC_DOCKER_TAG:-7.4.0}
    # changelog: https://github.com/opencloud-eu/opencloud/tree/main/changelog
    # release notes: https://docs.opencloud.eu/opencloud_release_notes.html
    user: 1000:1000
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.opencloud.rule=Host(`${OPENCLOUD_HOST}`)
      - traefik.http.routers.opencloud.entrypoints=websecure
      - traefik.http.routers.opencloud.tls=true
      - traefik.http.routers.opencloud.tls.certresolver=le
    entrypoint:
      - /bin/sh
    # run opencloud init to initialize a configuration file with random secrets
    # it will fail on subsequent runs, because the config file already exists
    # therefore we ignore the error and then start the opencloud server
    command:
      - -c
      - opencloud init || true; opencloud server
    environment:
      # enable services that are not started automatically
      OC_ADD_RUN_SERVICES: ${START_ADDITIONAL_SERVICES}
      OC_URL: https://${OPENCLOUD_HOST}
      OC_LOG_LEVEL: ${LOG_LEVEL:-info}
      OC_LOG_COLOR: ${LOG_PRETTY:-false}
      OC_LOG_PRETTY: ${LOG_PRETTY:-false}
      OC_ASYNC_UPLOADS: false
      # do not use SSL between the reverse proxy and OpenCloud
      PROXY_TLS: false
      # INSECURE: needed if OpenCloud / reverse proxy is using self generated certificates
      OC_INSECURE: false
      # basic auth (not recommended, but needed for eg. WebDav clients that do not support OpenID Connect)
      PROXY_ENABLE_BASIC_AUTH: false
      # demo users
      IDM_CREATE_DEMO_USERS: false
      # admin password
      IDM_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      # email server (if configured)
      NOTIFICATIONS_SMTP_HOST: ${SMTP_HOST}
      NOTIFICATIONS_SMTP_PORT: ${SMTP_PORT}
      NOTIFICATIONS_SMTP_SENDER: ${SMTP_SENDER}
      NOTIFICATIONS_SMTP_USERNAME: ${SMTP_USERNAME}
      NOTIFICATIONS_SMTP_PASSWORD: ${SMTP_PASSWORD}
      NOTIFICATIONS_SMTP_INSECURE: ${SMTP_INSECURE}
      NOTIFICATIONS_SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION}
      NOTIFICATIONS_SMTP_ENCRYPTION: ${SMTP_TRANSPORT_ENCRYPTION:-none}
      FRONTEND_ARCHIVER_MAX_SIZE: "10000000000"
      FRONTEND_CHECK_FOR_UPDATES: true
      # PROXY_CSP_CONFIG_FILE_LOCATION: /etc/opencloud/csp.yaml
      # enable to allow using the banned passwords list
      # OC_PASSWORD_POLICY_BANNED_PASSWORDS_LIST: banned-password-list.txt
      # control the password enforcement and policy for public shares
      OC_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD: true
      OC_SHARING_PUBLIC_WRITEABLE_SHARE_MUST_HAVE_PASSWORD: false
      OC_PASSWORD_POLICY_DISABLED: false
      OC_PASSWORD_POLICY_MIN_CHARACTERS: 8
      OC_PASSWORD_POLICY_MIN_LOWERCASE_CHARACTERS: 1
      OC_PASSWORD_POLICY_MIN_UPPERCASE_CHARACTERS: 1
      OC_PASSWORD_POLICY_MIN_DIGITS: 1
      OC_PASSWORD_POLICY_MIN_SPECIAL_CHARACTERS: 1
      # default language for services/WebUI; defaults to English, language code (ISO 639-1, e.g. de, en, fr)
      OC_DEFAULT_LANGUAGE: en
      # this is needed for setting the correct CSP header
      EURO_OFFICE_DOMAIN: ${EURO_OFFICE_HOST}
      # expose nats and the reva gateway for the collaboration service
      NATS_NATS_HOST: 0.0.0.0
      GATEWAY_GRPC_ADDR: 0.0.0.0:9142
      EURO_OFFICE_JWT_SECRET: ${EURO_OFFICE_JWT_SECRET}
      PROXY_AUTOPROVISION_ACCOUNTS: true
      PROXY_ROLE_ASSIGNMENT_DRIVER: oidc
      OC_OIDC_ISSUER: ${OIDC_BASE_URL}
      WEB_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      WEB_OIDC_AUTHORITY: ${OIDC_BASE_URL}
      WEB_OIDC_METADATA_URL: ${WEB_OIDC_METADATA_URL}
      WEB_OIDC_RESPONSE_TYPE: code
      WEB_OIDC_SCOPE: openid profile email groups
      PROXY_OIDC_REWRITE_WELLKNOWN: true
      PROXY_USER_OIDC_CLAIM: preferred_username
      OC_EXCLUDE_RUN_SERVICES: idp
      PROXY_CSP_CONFIG_FILE_LOCATION: /etc/opencloud/csp.yml
      PROXY_USER_CS3_CLAIM: username
      PROXY_CONFIG_FILE: /etc/opencloud/proxy.yml
      STORAGE_USERS_DRIVER: decomposeds3
      STORAGE_SYSTEM_DRIVER: decomposed
      STORAGE_USERS_DECOMPOSEDS3_ENDPOINT: ${DECOMPOSEDS3_ENDPOINT}
      STORAGE_USERS_DECOMPOSEDS3_REGION: ${DECOMPOSEDS3_REGION}
      STORAGE_USERS_DECOMPOSEDS3_ACCESS_KEY: ${DECOMPOSEDS3_ACCESS_KEY}
      STORAGE_USERS_DECOMPOSEDS3_SECRET_KEY: ${DECOMPOSEDS3_SECRET_KEY}
      STORAGE_USERS_DECOMPOSEDS3_BUCKET: ${DECOMPOSEDS3_BUCKET}
    volumes:
      # configure the .env file to use own paths instead of docker internal volumes
      - ${OC_CONFIG_DIR:-opencloud-config}:/etc/opencloud
      - ${OC_DATA_DIR:-opencloud-data}:/var/lib/opencloud
      - ${OC_APPS_DIR:-./config/opencloud/apps}:/var/lib/opencloud/web/assets/apps
    logging:
      driver: local
  collaboration:
    container_name: oc-collaboration
    # renovate: depName=opencloudeu/opencloud-rolling
    image: opencloudeu/opencloud-rolling:${OC_DOCKER_TAG:-7.4.0}
    user: 1000:1000
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.collaboration.rule=Host(`${WOPISERVER_HOST}`)
      - traefik.http.routers.collaboration.entrypoints=websecure
      - traefik.http.routers.collaboration.tls=true
      - traefik.http.routers.collaboration.tls.certresolver=le
      - traefik.http.routers.collaboration.service=collaboration
      - traefik.http.services.collaboration.loadbalancer.server.port=9300
      - traefik.docker.network=proxy
    depends_on:
      opencloud:
        condition: service_started
      euro-office:
        condition: service_healthy
    entrypoint:
      - /bin/sh
    command:
      - -c
      - opencloud collaboration server
    environment:
      COLLABORATION_GRPC_ADDR: 0.0.0.0:9301
      COLLABORATION_HTTP_ADDR: 0.0.0.0:9300
      MICRO_REGISTRY: nats-js-kv
      MICRO_REGISTRY_ADDRESS: opencloud:9233
      COLLABORATION_WOPI_SRC: https://${WOPISERVER_DOMAIN}
      COLLABORATION_APP_NAME: Euro-Office
      COLLABORATION_APP_PRODUCT: OnlyOffice
      COLLABORATION_APP_ADDR: https://${EURO_OFFICE_HOST}
      COLLABORATION_APP_ICON: https://${EURO_OFFICE_HOST}/web-apps/apps/documenteditor/main/resources/img/favicon.ico
      COLLABORATION_APP_INSECURE: true
      COLLABORATION_CS3API_DATAGATEWAY_INSECURE: true
      COLLABORATION_APP_PROOF_DISABLE: "true"
      COLLABORATION_LOG_LEVEL: info
      OC_URL: https://${OPENCLOUD_HOST}
      OC_EVENTS_ENDPOINT: opencloud:9233
      EURO_OFFICE_JWT_SECRET: ${EURO_OFFICE_JWT_SECRET}
    volumes:
      # configure the .env file to use own paths instead of docker internal volumes
      - ${OC_CONFIG_DIR:-opencloud-config}:/etc/opencloud
    logging:
      driver: ${LOG_DRIVER:-local}
    restart: unless-stopped
  euro-office:
    image: ghcr.io/euro-office/documentserver:latest
    container_name: euro-office
    # changelog https://github.com/EURO-office/DocumentServer/releases
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.euroffice.rule=Host(`${EURO_OFFICE_HOST}`)
      - traefik.http.routers.euroffice.entrypoints=websecure
      - traefik.http.routers.euroffice.tls=true
      - traefik.http.routers.euroffice.tls.certresolver=le
      - traefik.http.routers.euroffice.service=euroffice
      - traefik.http.services.euroffice.loadbalancer.server.port=80
      - traefik.docker.network=proxy
      - traefik.http.routers.euroffice.middlewares=euroffice-headers
      - traefik.http.middlewares.euroffice-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.euroffice-headers.headers.customrequestheaders.X-Forwarded-Ssl=on
    environment:
      WOPI_ENABLED: "true"
      # self-signed certificate
      USE_UNAUTHORIZED_STORAGE: true
      JWT_SECRET: ${EURO_OFFICE_JWT_SECRET}
      JWT_ENABLED: true
      DOCUMENT_SERVER_PUBLIC_URL: https://${EURO_OFFICE_HOST}
      DOCUMENT_SERVER_EXTERNAL_URL: https://${EURO_OFFICE_HOST}
    volumes:
      # Mount local TrueType fonts so the container can use system fonts
      # (e.g. Microsoft fonts like Arial, Calibri, Cambria by installing the `ttf-mscorefonts-installer` package).
      - /usr/share/fonts/truetype:/usr/share/fonts/truetype/more:ro
    logging:
      driver: local
    restart: always
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/80 && printf 'GET /hosting/discovery
          HTTP/1.1\r

          Host: localhost\r

          Connection: close\r

          \r

          ' >&3 && cat <&3 | head -1 | grep -q '200 OK'"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
  radicale:
    image: opencloudeu/radicale:latest
    container_name: radicale
    networks:
      - proxy
    logging:
      driver: local
    restart: always
    volumes:
      - /opt/data/opencloud/config/radicale/:/etc/radicale/
      - /opt/data/opencloud/radicale:/var/lib/radicale
networks:
  proxy:
    external: true
