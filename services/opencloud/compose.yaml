services:
  opencloud:
    container_name: opencloud
    # renovate: depName=opencloudeu/opencloud-rolling
    image: opencloudeu/opencloud-rolling:${OC_DOCKER_TAG}
    user: 1000:1000

    networks:
      - proxy

    labels:
      - traefik.enable=true
      - traefik.http.middlewares.hsts-header.headers.stsSeconds=31536000
      - traefik.http.middlewares.hsts-header.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.hsts-header.headers.stsPreload=true
      - traefik.http.middlewares.hsts-header.headers.forceSTSHeader=true
      - traefik.http.routers.opencloud.rule=Host(`${OPENCLOUD_HOST}`)
      - traefik.http.routers.opencloud.entrypoints=websecure
      - traefik.http.routers.opencloud.tls=true
      - traefik.http.routers.opencloud.tls.certresolver=le
      - traefik.http.routers.opencloud.middlewares=hsts-header
      - traefik.http.services.opencloud.loadbalancer.server.port=9200

    entrypoint:
      - /bin/sh

    command:
      - -c
      - opencloud init || true; opencloud server

    env_file:
      - .env

    volumes:
      - /mnt/opencloud:/var/lib/opencloud/storage/users/users
      - /opt/data/opencloud/config:/etc/opencloud
      - /opt/data/opencloud/data:/var/lib/opencloud
      - /opt/data/opencloud/app:/var/lib/opencloud/web/assets/apps

    logging:
      driver: local


