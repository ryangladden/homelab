  euro-office:
    image: ghcr.io/euro-office/documentserver:latest
    container_name: euro-office

    networks:
      - proxy

    labels:
      - traefik.enable=true
      - traefik.http.routers.euroffice.rule=Host(`${EURO_OFFICE_HOST}`)
      - traefik.http.routers.euroffice.entrypoints=websecure
      - traefik.http.routers.euroffice.tls=true
      - traefik.http.routers.euroffice.tls.certresolver=le
      - traefik.http.routers.euroffice.service=euroffice
      - traefik.http.services.euroffice.loadbalancer.server.port=80
      - traefik.docker.network=proxy
      - traefik.http.routers.euroffice.middlewares=euroffice-headers
      - traefik.http.middlewares.euroffice-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.euroffice-headers.headers.customrequestheaders.X-Forwarded-Ssl=on

    env_file:
      - .env

    volumes:
      - /usr/share/fonts/truetype:/usr/share/fonts/truetype/more:ro

    logging:
      driver: local

    restart: always

    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/80 &&
          printf 'GET /hosting/discovery HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | head -1 | grep -q '200 OK'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s


  radicale:
    image: opencloudeu/radicale:latest
    container_name: radicale

    networks:
      - proxy

    logging:
      driver: local

    restart: always

    volumes:
      - /opt/data/opencloud/config/radicale/:/etc/radicale/
      - /opt/data/opencloud/radicale:/var/lib/radicale


networks:
  proxy:
    external: true
