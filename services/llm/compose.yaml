services:

  openwebui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:cuda
    restart: unless-stopped
    gpus: all
    env_file:
      - .env
    volumes:
      - /opt/data/llm/open-webui:/app/backend/data
    labels:
      traefik.enable: true
      traefik.http.routers.ai.rule: Host(`${AI_HOST}`)
      traefik.http.routers.ai.entrypoints: websecure
      traefik.http.routers.ai.tls: true
      traefik.http.routers.ai.tls.certresolver: le
      traefik.http.services.ai.loadbalancer.server.port: 8080
    networks:
      - proxy
      
  ollama:
    ports:
      - 11434:11434
    container_name: ollama
    volumes:
      - /opt/state/llm/ollama:/root/.ollama
    gpus: all
    image: ollama/ollama
    networks:
      - proxy
      
  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    restart: always
    env_file: .env
    volumes:
      - ./searxng-config/:/etc/searxng/:Z
      - /opt/state/searxng/cache:/var/cache/searxng/
    networks:
      - proxy
      - internal
    labels:
      traefik.enable: true
      traefik.http.routers.searxng.rule: Host(`${TRAEFIK_SEARXNG_HOST}`)
      traefik.http.routers.searxng.entrypoints: websecure
      traefik.http.routers.searxng.tls: true
      traefik.http.routers.searxng.tls.certresolver: le
      traefik.http.routers.searxng.middlewares: tinyauth@file
      
  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - /opt/state/searxng/valkey:/data/
    networks:
      - internal
      
networks:
  proxy:
    external: true
  internal:
    internal: true
