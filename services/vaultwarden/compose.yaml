services:

  vaultwarden-old:
    image: vaultwarden/server:latest
    container_name: vaultwarden-old
    restart: unless-stopped
    environment:
      DISABLE_ADMIN_TOKEN: true
    volumes:
      - /opt/data/vaultwarden:/data/
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.vaultwarden.rule: Host(`${VAULTWARDEN_HOST_OLD}`)
      traefik.http.routers.vaultwarden.entrypoints: websecure
      traefik.http.routers.vaultwarden.tls: true
      traefik.http.routers.vaultwarden.tls.certresolver: le
      traefik.http.routers.vaultwarden.service: vaultwarden
      traefik.http.services.vaultwarden.loadbalancer.server.port: 80
      traefik.http.routers.vaultwarden-admin.rule: Host(`${VAULTWARDEN_HOST_OLD}`) && PathPrefix(`/admin`)
      traefik.http.routers.vaultwarden-admin.entrypoints: websecure
      traefik.http.routers.vaultwarden-admin.tls: true
      traefik.http.routers.vaultwarden-admin.tls.certresolver: le
      traefik.http.routers.vaultwarden-admin.middlewares: tinyauth@file
      traefik.http.routers.vaultwarden-admin.service: vaultwarden
      traefik.http.routers.vaultwarden-admin.priority: 100

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /opt/data/vaultwarden-new:/data/
    networks:
      - proxy
      - internal
    labels:
      traefik.enable: true
      traefik.http.routers.vaultwarden.rule: Host(`${VAULTWARDEN_HOST}`)
      traefik.http.routers.vaultwarden.entrypoints: websecure
      traefik.http.routers.vaultwarden.tls: true
      traefik.http.routers.vaultwarden.tls.certresolver: le
      traefik.http.routers.vaultwarden.service: vaultwarden
      traefik.http.services.vaultwarden.loadbalancer.server.port: 80
      traefik.http.routers.vaultwarden-admin.rule: Host(`${VAULTWARDEN_HOST}`) && PathPrefix(`/admin`)
      traefik.http.routers.vaultwarden-admin.entrypoints: websecure
      traefik.http.routers.vaultwarden-admin.tls: true
      traefik.http.routers.vaultwarden-admin.tls.certresolver: le
      traefik.http.routers.vaultwarden-admin.middlewares: tinyauth@file
      traefik.http.routers.vaultwarden-admin.service: vaultwarden
      traefik.http.routers.vaultwarden-admin.priority: 100

  postgres:
    image: postgres:16
    networks:
      - internal
    restart: always
    container_name: vaultwarden-postgres
    shm_size: 128mb
    volumes:
      - /opt/db/vaultwarden:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: vaultwarden
      POSTGRES_DB: vaultwarden

networks:
  proxy:
    external: true
  internal:
    internal: true
