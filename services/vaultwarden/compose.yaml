services:

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /opt/data/vaultwarden:/data/
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.vaultwarden.rule: Host(`${VAULTWARDEN_HOST}`)
      traefik.http.routers.vaultwarden.middlewares: tinyauth@file
      tinyauth.apps.vaultwarden.config.domain: ${VAULTWARDEN_HOST}
      tinyauth.apps.vaultwarden.path.block: ^/admin(/.*)?$
      



networks:
  proxy:
    external: true
