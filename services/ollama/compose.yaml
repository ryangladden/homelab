services:      
  ollama:
    ports:
      - 11434:11434
    container_name: ollama
    environment:
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - /opt/state/llm/ollama:/root/.ollama
    gpus: all
    image: ollama/ollama
    networks:
      - internal
      - proxy

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.litellm.rule: Host(`${LITELLM_HOST}`)
      traefik.http.routers.litellm.entrypoints: websecure
      traefik.http.routers.litellm.tls: true
      traefik.http.routers.litellm.tls.certresolver: le
      traefik.http.services.litellm.loadbalancer.server.port: 4000
    volumes:
      - ./config/config.yaml:/app/config.yaml:ro
    env_file: .env
    command:
      - "--config"
      - "/app/config.yaml"
    depends_on:
      - ollama
    networks:
      - proxy
      - internal
    
  db:
    image: postgres:16
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - /opt/data/ollama/litellm/litellm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

networks:
  proxy:
    external: true
  internal: 
    internal: true
