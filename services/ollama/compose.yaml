services:
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:unified-cuda
    container_name: llama-swap
    restart: unless-stopped

    ports:
      - "11434:8080"

    volumes:
      - /opt/state/llama.cpp/config.yaml:/etc/llama-swap/config/config.yaml:ro
      - /opt/state/llama.cpp/models:/models

    gpus: all

    env_file: .env

    security_opt:
      - no-new-privileges:true


    labels:
      traefik.enable: "true"

      # UI: protected by TinyAuth
      traefik.http.routers.llama-swap-ui.rule: >-
        Host(`${LLAMA_SWAP_HOST}`) &&
        (Path(`/ui`) || PathPrefix(`/ui/`))
      traefik.http.routers.llama-swap-ui.priority: 100
      traefik.http.routers.llama-swap-ui.middlewares: tinyauth@file
      traefik.http.routers.llama-swap-ui.service: llama-swap

      # Everything else: no TinyAuth
      traefik.http.routers.llama-swap.rule: Host(`${LLAMA_SWAP_HOST}`)
      traefik.http.routers.llama-swap.priority: 10
      traefik.http.routers.llama-swap.service: llama-swap

      # Shared backend
      traefik.http.services.llama-swap.loadbalancer.server.port: 8080

      # TinyAuth application configuration
      tinyauth.apps.llama-swap.config.domain: ${LLAMA_SWAP_HOST}
      tinyauth.apps.llama-swap.response.basicauth.username: ""
      tinyauth.apps.llama-swap.response.basicauth.password: ${LLAMA_SWAP_API_KEY}


    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

