services:
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:unified-cuda
    container_name: llama-swap
    restart: unless-stopped

    ports:
      - "11434:8080"

    volumes:
      - /opt/state/llama.cpp/config.yaml:/etc/llama-swap/config/config.yaml:ro
      - /opt/state/llama.cpp/models:/models

    gpus: all

    env_file: .env

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

