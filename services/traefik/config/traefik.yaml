entryPoints:
  websecure:
    # forwardedHeaders:
    #   insecure: true
    asDefault: true
    address: ":443"
    http:
      tls:
        certResolver: le-dns
      middlewares:
        - geoblock@file
        - crowdsec@file
    transport:
      respondingTimeouts:
        readTimeout: 10m
        writeTimeout: 10m
        idleTimeout: 180s

tcp:
  serversTransports:
    proxyproto-tcp:
      proxyProtocol:
        version: 2   


providers:
  docker:
    exposedByDefault: false
    network: proxy
    endpoint: tcp://socket-proxy:2375
  file:
    directory: /dynamic
    watch: true

api:
  dashboard: true

ping: true

accessLog:
  filePath: /var/log/traefik/access.log
  format: json

certificatesResolvers:
  le-dns:
    acme:
      storage: /letsencrypt/acme-dns.json
      keyType: EC256
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

experimental:
  localPlugins:
    opencloud-user-mapper:
      moduleName: github.com/ryangladden/traefik-opencloud-user-mapper
  plugins:
    bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.8.1
    geoblock:
      moduleName: "github.com/PascalMinder/geoblock"
      version: "v0.3.3"
