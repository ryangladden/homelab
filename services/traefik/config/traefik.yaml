entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    forwardedHeaders:
      insecure: true
    address: ":443"
    http:
      tls:
        certResolver: le-dns
        domains:
        - main: {{ env "HOST_DOMAIN" }}
          sans:
            - "*.{{ env "HOST_DOMAIN" }}"
      middlewares:
        - crowdsec@file
    transport:
      respondingTimeouts:
        readTimeout: 10m
        writeTimeout: 10m
        idleTimeout: 180s
  ssh:
    address: ":22"

tcp:
  serversTransports:
    proxyproto-tcp:
      proxyProtocol:
        version: 2   


providers:
  docker:
    exposedByDefault: false
    network: proxy
  file:
    directory: /dynamic
    watch: true

api:
  dashboard: true

ping: true

accessLog:
  filePath: /var/log/traefik/access.log
  format: json

certificatesResolvers:
  le:
    acme:
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
  le-dns:
    acme:
      storage: /letsencrypt/acme-dns.json
      keyType: EC256
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

experimental:
  localPlugins:
    opencloud-user-mapper:
      moduleName: github.com/ryangladden/traefik-opencloud-user-mapper
  plugins:
    bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.8.1
