http:


  routers:    

    home-assistant:
      rule: "Host(`home.gladden.uk`)"
      service: home-assistant
      entrypoints:
        - websecure
      tls: 
        certresolver: le

    gertrude:
      rule: "Host(`gertrude.gladden.uk`)"
      service: gertrude
      entrypoints:
        - websecure
      tls:
        certresolver: le
      middlewares:
        - tinyauth@file
        
    truenas:
      rule: "Host(`nas.gladden.uk`)"
      service: truenas
      entrypoints:
        - websecure
      tls:
        certresolver: le
      middlewares:
        - tinyauth@file

    dashboard:
      rule: Host(`dashboard.gladden.uk`)
      entryPoints:
        - websecure
      service: api@internal
      middlewares:
        - tinyauth@file
      tls:
        certResolver: le

    k3s:
      rule: Host(`kube.gladden.uk`)
      entryPoints:
        - websecure
      service: k3s
      tls:
        certResolver: le

    incus:
      rule: Host(`incus.gladden.uk`)
      entryPoints:
        - websecure
      service: incus
      middlewares:
        - tinyauth@file
      tls:
        certResolver: le

    s3:
      rule: Host(`s3.gladden.uk`)
      entryPoints:
        - websecure
      service: s3
      tls:
        certResolver: le

    backrest:
      rule: Host(`backup.gladden.uk`)
      entryPoints:
        - websecure
      service: backrest
      middlewares:
        - tinyauth@file
      tls:
        certResolver: le

    printer:
      rule: Host(`printer.gladden.uk`)
      entryPoints:
        - websecure
      service: printer
      middlewares:
        - tinyauth@file
      tls:
        certResolver: le

  services:

    home-assistant:
      loadBalancer:
        servers:
          - url: "http://192.168.1.197:8123"

    gertrude:
      loadBalancer:
        servers:
          - url: "http://192.168.1.251:9090"

    truenas:
      loadBalancer:
        servers:
          - url: "http://192.168.1.250"

    k3s:
      loadBalancer:
        passHostHeader: true
        serversTransport: rancher-insecure
        servers:
          - url: "https://192.168.1.206"

    incus:
      loadBalancer:
        serversTransport: incus-mtls
        servers:
          - url: "https://192.168.1.251:8443"

    s3:
      loadBalancer:
        servers:
          - url: "http://192.168.1.250:30293"

    backrest:
      loadBalancer:
        servers:
          - url: "http://192.168.1.252:9898"

    printer:
      loadBalancer:
        servers:
          - url: "http://192.168.1.172:80"

  serversTransports:
    rancher-insecure:
      insecureSkipVerify: true
    incus-mtls:
      certificates:
        - certFile: /certs/incus-client.crt
          keyFile: /certs/incus-client.key
      insecureSkipVerify: true

  middlewares:
    tinyauth:
      forwardauth:
        address: http://tinyauth:3000/api/auth/traefik
        authResponseHeaders:
          - Remote-User
          
    opencloud-user-mapper:
      plugin:
        opencloud-user-mapper:
          opencloudURL: http://opencloud:9200
          usernameHeader: Remote-User
          outputHeader: X-Remote-User
          serviceUsernameEnv: OC_MAPPER_USERNAME
          appTokenEnv: OC_MAPPER_APP_TOKEN
          cacheTTL: 1h
          requestTimeout: 3s
