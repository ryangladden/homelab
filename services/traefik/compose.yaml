services:

  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    env_file: .env
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - radicale-internal
    ports:
      - 222:22
      - 80:80
      - 443:443
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./config/dynamic:/dynamic:ro
      - ./plugins/traefik-opencloud-user-mapper:/plugins-local/src/github.com/ryangladden/traefik-opencloud-user-mapper:ro
      - /opt/state/traefik/letsencrypt:/letsencrypt
      - /opt/state/traefik/certs:/certs
      - /etc/localtime:/etc/localtime:ro
      - /opt/state/traefik/log:/var/log/traefik/
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:8080/ping
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 60s

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1
    container_name: "crowdsec"
    restart: unless-stopped
    env_file: .env
    networks:
      - proxy
    volumes:
      - ./acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - /opt/state/traefik/log:/var/log/traefik:ro
      - /opt/state/crowdsec/data:/var/lib/crowdsec/data/
      - /opt/state/crowdsec/config:/etc/crowdsec/
    labels:
      - "traefik.enable=false"


networks:
  proxy:
    name: proxy
    external: true
  radicale-internal:
    external: true
