services:

  traefik:
    image: ghcr.io/traefik/traefik:latest
    container_name: traefik
    restart: unless-stopped
    env_file: .env
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - radicale-internal
    ports:
      - 443:443
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./config/dynamic:/dynamic:ro
      - ./plugins/traefik-opencloud-user-mapper:/plugins-local/src/github.com/ryangladden/traefik-opencloud-user-mapper:ro
      - /opt/state/traefik/letsencrypt:/letsencrypt
      - /opt/state/traefik/certs:/certs
      - /etc/localtime:/etc/localtime:ro
      - /opt/state/traefik/log:/var/log/traefik/
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wildcard.rule=Host(`${HOST_DOMAIN}`)"
      - "traefik.http.routers.wildcard.entrypoints=websecure"
      - "traefik.http.routers.wildcard.tls=true"
      - "traefik.http.routers.wildcard.tls.certresolver=le-dns"
      - "traefik.http.routers.wildcard.tls.domains[0].main=${HOST_DOMAIN}"
      - "traefik.http.routers.wildcard.tls.domains[0].sans=*.${HOST_DOMAIN}"
      - "traefik.http.routers.wildcard.service=noop@internal"
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:8080/ping
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 60s

  crowdsec:
    image: ghcr.io/crowdsecurity/crowdsec:v1.8.1
    container_name: "crowdsec"
    restart: unless-stopped
    env_file: .env
    networks:
      - proxy
    volumes:
      - ./config/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - /opt/state/traefik/log:/var/log/traefik:ro
      - /opt/state/crowdsec/data:/var/lib/crowdsec/data/
      - /opt/state/crowdsec/config:/etc/crowdsec/
    labels:
      - "traefik.enable=false"

  crowdsec-web-ui:
    image: ghcr.io/theduffman85/crowdsec-web-ui:latest
    container_name: crowdsec_web_ui
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.crowdsec-ui.rule: Host(`${CROWDSEC_UI_HOST}`)
      traefik.http.routers.crowdsec-ui.entrypoints: websecure
      traefik.http.routers.crowdsec-ui.tls: true
      traefik.http.services.crowdsec-ui.loadbalancer.server.port: 3000
      traefik.http.routers.crowdsec-ui.middlewares: tinyauth@file
      traefik.docker.network: proxy
    env_file: .env
    volumes:
      - /opt/state/crowdsec/ui:/app/data
    restart: unless-stopped


networks:
  proxy:
    name: proxy
    external: true
  radicale-internal:
    external: true
