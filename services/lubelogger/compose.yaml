services:
  app:
    image: ghcr.io/hargata/lubelogger:latest
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - /opt/data/lubelogger/data:/App/data
      - /opt/data/lubelogger/keys:/root/.aspnet/DataProtection-Keys
    labels:
      traefik.enable: true
      traefik.http.routers.lubelogger.rule: Host(`${LUBELOGGER_HOST}`)
networks:
  proxy:
    external: true
