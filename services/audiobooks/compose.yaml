services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    volumes:
      - /opt/data/audiobookshelf:/config
      - /opt/state/audiobookshelf:/metadata
      - /mnt/audiobookshelf/books:/audiobooks
      - /mnt/audiobookshelf/podcasts:/podcasts
    labels:
      traefik.enable: true
      traefik.http.routers.audiobookshelf.rule: Host(`${AUDIOBOOKSHELF_HOST}`)
      traefik.http.services.audiobookshelf.loadbalancer.server.port: 80
    env_file: .env
    networks:
      - proxy
      - minuspod
    environment:
      - TZ=America/Denver
    restart: unless-stopped

  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    environment:
      PUID: 1000
      PGID: 1000
    env_file: .env
    labels:
      traefik.enable: true
      traefik.http.routers.shelfmark.rule: Host(`${SHELFMARK_HOST}`)
      traefik.http.services.shelfmark.loadbalancer.server.port: 8084
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - /mnt/audiobookshelf/books:/books
      - /opt/data/audiobookshelf:/config
      - /mnt/plex/torrents/audiobooks:/data/torrents/audiobooks

  minuspod:
    image: ttlequals0/minuspod:latest
    container_name: minuspod
    platform: linux/amd64
    ports:
      - 8000:8000
    # stop_grace_period: 360s
    env_file: .env
    environment:
      - SESSION_COOKIE_SECURE=false
    networks:
      - minuspod
    volumes:
      - /opt/state/minuspod/data:/app/data
      - ./patch/minuspod-patch.py:/app/patch-minuspod.py:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${MINUSPOD_PORT:-8000}/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        python /app/patch-minuspod.py
        exec /app/entrypoint.sh

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

networks:
  proxy:
    external: true
  minuspod:
  whisper:
