services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.10
    hostname: wazuh.manager
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
    networks:
      - wazuh
    env_file: .env
    volumes:
      - /opt/data/wazuh/wazuh_api_configuration:/var/ossec/api/configuration
      - /opt/data/wazuh/wazuh_etc:/var/ossec/etc
      - /opt/state/wazuh/wazuh_logs:/var/ossec/logs
      - /opt/data/wazuh/wazuh_queue:/var/ossec/queue
      - /opt/state/wazuh/wazuh_var_multigroups:/var/ossec/var/multigroups
      - /opt/git-migrate/wazuh/wazuh_integrations:/var/ossec/integrations
      - /opt/git-migrate/wazuh/wazuh_active_response:/var/ossec/active-response/bin
      - /opt/git-migrate/wazuh/wazuh_agentless:/var/ossec/agentless
      - /opt/git-migrate/wazuh/wazuh_wodles:/var/ossec/wodles
      - /opt/git-migrate/wazuh/filebeat_etc:/etc/filebeat
      - /opt/state/wazuh/wazuhfilebeat_var:/var/lib/filebeat
      - /opt/data/wazuh/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - /opt/data/wazuh/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - /opt/data/wazuh/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.10
    hostname: wazuh.indexer
    restart: always
    networks:
      - wazuh
    env_file: .env
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - /opt/state/wazuh/wazuh-indexer-data:/var/lib/wazuh-indexer
      - /opt/data/wazuh/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - /opt/data/wazuh/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - /opt/data/wazuh/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - /opt/data/wazuh/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - /opt/data/wazuh/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - /opt/data/wazuh/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.10
    hostname: wazuh.dashboard
    restart: always
    ports:
      - 5601:5601
    env_file: .env
    volumes:
      - /opt/data/wazuh/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - /opt/data/wazuh/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - /opt/data/wazuh//wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - /opt/git-migrate/wazuh/wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    labels:
      traefik.enable: true
      traefik.http.routers.wazuh.rule: Host(`${WAZUH_HOST}`)
      traefik.http.services.wazuh.loadbalancer.server.port: 5601
    networks:
      - proxy
      - wazuh
    depends_on:
      - wazuh.indexer

networks:
  proxy:
    external: true
  wazuh:
