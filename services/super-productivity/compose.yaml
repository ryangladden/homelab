services:

  app:
    image: johannesjo/super-productivity:latest
    restart: unless-stopped
    networks:
      - proxy
    labels:
      traefik.enable: true
      traefik.http.routers.actual.rule: Host(`${SUPERPRODUCTIVITY_HOST}`)
      traefik.http.routers.actual.entrypoints: websecure
      traefik.http.routers.actual.tls: true
      traefik.http.routers.actual.tls.certresolver: le

networks:
  proxy:
    external: true
